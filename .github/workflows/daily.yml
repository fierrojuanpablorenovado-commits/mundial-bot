name: Mundial Bot - Daily Cron

on:
  schedule:
    # 13:00 UTC = 08:00 CDT México (México no observa DST desde 2022, UTC-6 todo el año)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true = solo notifica sin apostar)"
        required: false
        default: "false"
      target_date:
        description: "Fecha a simular YYYY-MM-DD (vacío = hoy). Ej: 2026-06-11"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: |
            model_state.json
            bankroll_state.json
            bets_history.json
            cache/
          key: mundial-state-${{ github.run_number }}
          restore-keys: |
            mundial-state-

      - name: Run mundial_runner
        env:
          # ── JP APUESTA MANUAL — bot solo notifica, NO apuesta ────────────────
          # JP decide manualmente cada apuesta tras revisar el WhatsApp del bot
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          BANKROLL_INITIAL: "1000"
          KELLY_DIV: "5"
          EDGE_MIN_PCT: "6"
          EDGE_MAX_PCT: "35"
          MAX_PICKS_PER_DAY: "3"
          SESSION_BUDGET_PCT: "25"
          STOP_LOSS_PCT: "30"
          SOFT_PAUSE_PCT: "15"
          PYTHONIOENCODING: "utf-8"
          # ── Notificaciones: CallMeBot WhatsApp (activado por JP 29-may-2026) ──
          NOTIFICATIONS_ENABLED: "true"
          CHANNEL: "callmebot"
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          # ── Credentials PlayDoit (misma cuenta JP) ────────────────────────────
          PLAYDOIT_USER: ${{ secrets.PLAYDOIT_USER }}
          PLAYDOIT_PASS: ${{ secrets.PLAYDOIT_PASS }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: python mundial_runner.py

      - name: Upload artifacts (state + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mundial-state-run-${{ github.run_number }}
          path: |
            model_state.json
            bankroll_state.json
            bets_history.json
          retention-days: 90
